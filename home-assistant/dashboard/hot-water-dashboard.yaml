title: Hot Water
views:
  - title: Hot Water
    path: hot-water
    icon: mdi:water-boiler
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bathroom & Laundry
            icon: mdi:shower
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: climate.34eae7b41fea
                primary: >
                  {{ state_attr('climate.34eae7b41fea', 'current_temperature') |
                  float(0) | round(1) }} °C
                secondary: >
                  {% set action = state_attr('climate.34eae7b41fea',
                  'hvac_action') %}

                  {% if is_state(
                    'binary_sensor.34eae7b41fea_fault',
                    'on'
                  ) %}
                    ⚠ FAULT

                  {% elif is_state(
                    'climate.34eae7b41fea',
                    'off'
                  ) %}
                    ⏻ OFF

                  {% elif
                  states('sensor.34eae7b41fea_xi_tong_shi_fou_jin_ru_gao_wen_re_shui_jie_duan_o15')
                  | float(0) > 0 %}
                    🔴 DISINFECTION / HIGH TEMP

                  {% elif action == 'heating' %}
                    🔥 HEATING

                  {% else %}
                    ✓ READY
                  {% endif %}
                icon: >
                  {% set action = state_attr('climate.34eae7b41fea',
                  'hvac_action') %}

                  {% if is_state(
                    'binary_sensor.34eae7b41fea_fault',
                    'on'
                  ) %}
                    mdi:alert-circle

                  {% elif is_state(
                    'climate.34eae7b41fea',
                    'off'
                  ) %}
                    mdi:water-boiler-off

                  {% elif action == 'heating' %}
                    mdi:water-boiler

                  {% else %}
                    mdi:check-circle
                  {% endif %}
                icon_color: >
                  {% set action = state_attr('climate.34eae7b41fea',
                  'hvac_action') %}

                  {% if is_state(
                    'binary_sensor.34eae7b41fea_fault',
                    'on'
                  ) %}
                    red

                  {% elif is_state(
                    'climate.34eae7b41fea',
                    'off'
                  ) %}
                    grey

                  {% elif action == 'heating' %}
                    orange

                  {% else %}
                    green
                  {% endif %}
                layout: vertical
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 250px;
                      border-radius: 30px;
                    }

                    mushroom-shape-icon {
                      --icon-size: 90px;
                    }

                    mushroom-state-info {
                      text-align: center;
                    }

                    .primary {
                      font-size: 32px !important;
                      font-weight: 700 !important;
                    }

                    .secondary {
                      font-size: 17px !important;
                      font-weight: 600 !important;
                      margin-top: 8px !important;
                    }
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    entity: climate.34eae7b41fea
                    primary: Target
                    secondary: |
                      {{ state_attr(
                        'climate.34eae7b41fea',
                        'temperature'
                      ) | float(0) | round(1) }} °C
                    icon: mdi:thermometer-check
                    icon_color: orange
                    tap_action:
                      action: more-info
                    card_mod:
                      style: |
                        ha-card {
                          height: 85px;
                          border-radius: 22px;
                        }

                        .primary {
                          font-weight: 600 !important;
                        }

                        .secondary {
                          font-size: 17px !important;
                          font-weight: 600 !important;
                        }
                  - type: tile
                    entity: >-
                      select.backyard_evo270_bathroom_laundry_34eae7b41fea_34eae7b41fea_operating_mode
                    name: Operating Mode
                    icon: mdi:cog
                    vertical: false
                    features:
                      - type: select-options
                    card_mod:
                      style: |
                        ha-card {
                          min-height: 155px;
                          border-radius: 22px;
                        }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.34eae7b41fea_top_temperature_t03
                primary: |
                  {{ states(entity) | float(0) | round(1) }} °C
                secondary: Top
                icon: mdi:thermometer-chevron-up
                icon_color: red
                layout: vertical
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 140px;
                      border-radius: 25px;
                    }
              - type: custom:mushroom-template-card
                entity: sensor.34eae7b41fea_bottom_temperature_t02
                primary: |
                  {{ states(entity) | float(0) | round(1) }} °C
                secondary: Bottom
                icon: mdi:thermometer-chevron-down
                icon_color: orange
                layout: vertical
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 140px;
                      border-radius: 25px;
                    }
              - type: custom:mushroom-template-card
                entity: sensor.34eae7b41fea_ambient_temperature_t01
                primary: |
                  {{ states(entity) | float(0) | round(1) }} °C
                secondary: Ambient
                icon: mdi:home-thermometer-outline
                icon_color: blue
                layout: vertical
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 140px;
                      border-radius: 25px;
                    }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: binary_sensor.34eae7b41fea_api_status
                primary: API
                secondary: |
                  {% if is_state(entity, 'on') %}
                    Online
                  {% else %}
                    Offline
                  {% endif %}
                icon: |
                  {% if is_state(entity, 'on') %}
                    mdi:cloud-check
                  {% else %}
                    mdi:cloud-alert
                  {% endif %}
                icon_color: |
                  {% if is_state(entity, 'on') %}
                    green
                  {% else %}
                    red
                  {% endif %}
                layout: vertical
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 130px;
                      border-radius: 25px;
                    }
              - type: custom:mushroom-template-card
                entity: binary_sensor.34eae7b41fea_fault
                primary: System
                secondary: |
                  {% if is_state(entity, 'on') %}
                    FAULT
                  {% else %}
                    Normal
                  {% endif %}
                icon: |
                  {% if is_state(entity, 'on') %}
                    mdi:alert-circle
                  {% else %}
                    mdi:check-circle
                  {% endif %}
                icon_color: |
                  {% if is_state(entity, 'on') %}
                    red
                  {% else %}
                    green
                  {% endif %}
                layout: vertical
                tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 130px;
                      border-radius: 25px;
                    }
          - type: heading
            heading: Schedule & Vacation
            icon: mdi:calendar-clock
          - type: heading
            heading: Timer 1
            icon: mdi:timer-outline
          - type: grid
            columns: 2
